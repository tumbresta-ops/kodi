name: Build binary add-ons
description: >
  Builds Kodi binary add-ons through tools/depends/target/binary-addons.
  Supports PVR, InputStream, VFS, and peripheral add-ons.
  Reports build results in the GitHub Actions step summary.

inputs:
  kodi-dir:
    description: Path to the checked-out Kodi source tree.
    required: false
    default: "."

  addons:
    description: >
      Space-separated add-on IDs or regular expressions (ADDONS).
    required: false
    default: "all"

  make-args:
    description: >
      Extra make variables, for example PREFIX=/usr
      for a native Linux build.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build binary add-ons
      shell: bash
      env:
        ADDONS: ${{ inputs.addons }}
        MAKE_ARGS: ${{ inputs.make-args }}
      working-directory: ${{ inputs.kodi-dir }}
      run: |
        set -euo pipefail

        rm -f cmake/addons/.success cmake/addons/.failure

        echo "Requested binary add-ons: ${ADDONS}"
        echo "Additional make arguments: ${MAKE_ARGS}"

        read -r -a extra_make_args <<< "${MAKE_ARGS}"
        make -C tools/depends/target/binary-addons \
          -j"$(getconf _NPROCESSORS_ONLN)" \
          ADDONS="${ADDONS}" \
          "${extra_make_args[@]}" \
          V=1 VERBOSE=1

        if [ -s cmake/addons/.failure ]; then
          echo "::error::Some binary add-ons failed to build:"
          cat cmake/addons/.failure
          exit 1
        fi

        if [ ! -s cmake/addons/.success ]; then
          echo "::error::No binary add-ons were built successfully"
          exit 1
        fi

    - name: Report add-on results
      if: always()
      shell: bash
      working-directory: ${{ inputs.kodi-dir }}
      run: |
        {
          echo "### Binary add-ons"
          echo ""

          if [ -s cmake/addons/.success ]; then
            echo "#### Built successfully"
            sed 's/^/- /' cmake/addons/.success
            echo ""
          fi

          if [ -s cmake/addons/.failure ]; then
            echo "#### Build failures"
            sed 's/^/- /' cmake/addons/.failure
            echo ""
          fi

          if [ ! -s cmake/addons/.success ] &&
             [ ! -s cmake/addons/.failure ]; then
            echo "No add-on result files were generated."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -s cmake/addons/.failure ]; then
          echo "::warning::Some binary add-ons failed: $(tr '\n' ' ' < cmake/addons/.failure)"
        fi
