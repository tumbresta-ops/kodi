name: Build Kodi Piers Kademlia (Android)

on:
  workflow_dispatch:
    inputs:
      target_abi:
        description: 'Target Android ABI (arm64-v8a, armeabi-v7a, or all)'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'arm64-v8a'
          - 'armeabi-v7a'
      configuration:
        description: 'Build configuration (Release or Debug)'
        required: true
        type: choice
        default: 'Release'
        options:
          - 'Release'
          - 'Debug'

permissions:
  contents: read

jobs:
  build:
    name: Build Kademlia Kodi for Android
    uses: ./.github/workflows/build-android.yml
    with:
      target_abi: ${{ inputs.target_abi || 'all' }}
      configuration: ${{ inputs.configuration || 'Release' }}
      kodi_repo: tumbresta-ops/xbmc
      kodi_ref: Piers
      build_binary_addons: false
