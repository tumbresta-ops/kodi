name: Build Binary Add-ons — Piers

on:
  workflow_dispatch:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: true
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: true
        type: string
        default: "Piers"
      addons:
        description: "Addon IDs/patterns, separated by spaces"
        required: true
        type: string
        default: "inputstream.adaptive"

  workflow_call:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: false
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: false
        type: string
        default: "Piers"
      addons:
        description: "Addon IDs/patterns, separated by spaces"
        required: false
        type: string
        default: "inputstream.* pvr.iptvsimple"

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 — Kodi Piers
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Kodi
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.kodi_repo }}
          ref: ${{ inputs.kodi_ref }}
          path: xbmc

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            ninja-build \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            python3-dev \
            curl \
            unzip \
            zip \
            zlib1g-dev

      - name: Resolve, build and package add-ons
        shell: bash
        env:
          ADDON_PATTERNS: ${{ inputs.addons }}
        run: |
          set -euo pipefail

          ADDON_BUILD_DIR="xbmc/tools/depends/target/binary-addons"
          ADDON_STATUS_DIR="xbmc/cmake/addons"
          ADDON_SOURCE_DIR="xbmc"

          rm -f \
            "${ADDON_STATUS_DIR}/.success" \
            "${ADDON_STATUS_DIR}/.failure"

          rm -rf "${GITHUB_WORKSPACE}/zips"
          mkdir -p "${GITHUB_WORKSPACE}/zips"

          if [[ -z "${ADDON_PATTERNS//[[:space:]]/}" ]]; then
            echo "::error::No add-on patterns specified"
            exit 1
          fi

          # Discover add-on IDs from addon.xml files.
          python3 - <<'PY' > "${RUNNER_TEMP}/available-addons.txt"
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("xbmc")
          ignored = {
              ".git", "build", "cmake-build-debug",
              "cmake-build-release", "tools"
          }

          found = set()

          for xml in root.rglob("addon.xml"):
              if any(part in ignored for part in xml.parts):
                  continue

              try:
                  tree = ET.parse(xml)
                  addon_id = tree.getroot().get("id")
                  if addon_id:
                      found.add(addon_id)
              except (ET.ParseError, OSError):
                  continue

          for addon_id in sorted(found):
              print(addon_id)
          PY

          # Expand wildcard patterns against discovered addon IDs.
          python3 - \
            "${ADDON_PATTERNS}" \
            "${RUNNER_TEMP}/available-addons.txt" \
            "${RUNNER_TEMP}/selected-addons.txt" <<'PY'
          import fnmatch
          import pathlib
          import sys

          patterns = sys.argv[1].split()
          available_file = pathlib.Path(sys.argv[2])
          output_file = pathlib.Path(sys.argv[3])

          available = available_file.read_text().splitlines()
          selected = []
          missing = []

          for pattern in patterns:
              matches = [
                  addon for addon in available
                  if fnmatch.fnmatchcase(addon, pattern)
              ]

              if not matches:
                  missing.append(pattern)
                  continue

              for addon in matches:
                  if addon not in selected:
                      selected.append(addon)

          if missing:
              print(
                  "::error::No matching addon IDs for: "
                  + ", ".join(missing)
              )
              sys.exit(1)

          if not selected:
              print("::error::No add-ons selected")
              sys.exit(1)

          output_file.write_text("\n".join(selected) + "\n")

          print("=== Resolved add-ons ===")
          for addon in selected:
              print(addon)
          PY

          # Convert the resolved list into the space-separated Make argument.
          ADDONS="$(paste -sd ' ' "${RUNNER_TEMP}/selected-addons.txt")"

          echo "=== Building add-ons ==="
          printf '%s\n' "${ADDONS}"

          make -C "${ADDON_BUILD_DIR}" \
            -j"$(nproc)" \
            PREFIX=/usr \
            ADDONS="${ADDONS}" \
            PACKAGE=1 \
            EXTRA_CMAKE_ARGS="-DPACKAGE_ZIP=ON -DPACKAGE_DIR=${GITHUB_WORKSPACE}/zips" \
            V=1 \
            VERBOSE=1

          if [[ -s "${ADDON_STATUS_DIR}/.failure" ]]; then
            echo "::error::Binary add-on build failed"
            cat "${ADDON_STATUS_DIR}/.failure"
            exit 1
          fi

          echo "=== Add-on build status ==="
          if [[ -f "${ADDON_STATUS_DIR}/.success" ]]; then
            cat "${ADDON_STATUS_DIR}/.success"
          else
            echo "::warning::No .success status file found"
          fi

          # Collect only Kodi addon packages; ignore unrelated ZIP fixtures.
          declare -A copied=()
          total=0

          while IFS= read -r addon; do
            echo "=== Collecting package: ${addon} ==="

            mapfile -t packages < <(
              find "${GITHUB_WORKSPACE}/xbmc" \
                -type f \
                -name "addon-${addon}-*-linux.zip" \
                -not -path '*/.git/*'
            )

            if [[ ${#packages[@]} -eq 0 ]]; then
              echo "::error::No Linux ZIP package found for '${addon}'"
              exit 1
            fi

            for package in "${packages[@]}"; do
              if [[ -z "${copied[$package]+x}" ]]; then
                cp -v "$package" "${GITHUB_WORKSPACE}/zips/"
                copied["$package"]=1
                ((total += 1))
              fi
            done
          done < "${RUNNER_TEMP}/selected-addons.txt"

          if [[ "$total" -eq 0 ]]; then
            echo "::error::No add-on ZIP packages collected"
            exit 1
          fi

          echo "=== Final packages ==="
          find "${GITHUB_WORKSPACE}/zips" \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            -printf '%f\n'

      - name: Upload binary add-on ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: binary-addons-linux-x86_64-piers
          path: zips/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: false
          include-hidden-files: false
