```yaml
name: Build Binary Add-ons — Linux Piers

on:
  workflow_dispatch:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: true
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: true
        type: string
        default: "Piers"

  workflow_call:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: false
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: false
        type: string
        default: "Piers"

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 — Kodi Piers
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Kodi
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.kodi_repo }}
          ref: ${{ inputs.kodi_ref }}
          path: xbmc

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            ninja-build \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            python3-dev \
            curl \
            unzip \
            zip \
            zlib1g-dev

      - name: Build and package binary add-on
        shell: bash
        run: |
          set -euo pipefail

          ADDON_BUILD_DIR="xbmc/tools/depends/target/binary-addons"
          ADDON_STATUS_DIR="xbmc/cmake/addons"

          rm -f \
            "${ADDON_STATUS_DIR}/.success" \
            "${ADDON_STATUS_DIR}/.failure"

          mkdir -p "${GITHUB_WORKSPACE}/zips"

          make -C "${ADDON_BUILD_DIR}" \
            -j"$(nproc)" \
            PREFIX=/usr \
            ADDONS="inputstream.adaptive" \
            PACKAGE=1 \
            EXTRA_CMAKE_ARGS="-DPACKAGE_ZIP=ON -DPACKAGE_DIR=${GITHUB_WORKSPACE}/zips" \
            V=1 \
            VERBOSE=1

          if [[ -s "${ADDON_STATUS_DIR}/.failure" ]]; then
            echo "::error::Binary add-on build failed"
            cat "${ADDON_STATUS_DIR}/.failure"
            exit 1
          fi

          echo "=== Add-on build status ==="
          if [[ -f "${ADDON_STATUS_DIR}/.success" ]]; then
            cat "${ADDON_STATUS_DIR}/.success"
          else
            echo "::warning::No .success status file found"
          fi

          echo "=== Searching for ZIP packages ==="

          find "${GITHUB_WORKSPACE}/xbmc" \
            -type f \
            -name '*.zip' \
            -not -path '*/.git/*' \
            -print

          find "${GITHUB_WORKSPACE}/xbmc" \
            -type f \
            -name '*.zip' \
            -not -path '*/.git/*' \
            -exec cp -v -n {} "${GITHUB_WORKSPACE}/zips/" \;

          echo "=== Verifying ZIP packages ==="

          if ! find "${GITHUB_WORKSPACE}/zips" \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            -print -quit | grep -q .; then
            echo "::error::No binary add-on ZIP packages were generated"
            echo "Inspect the build log and Kodi packaging targets."
            exit 1
          fi

          ls -lh "${GITHUB_WORKSPACE}/zips"

      - name: Upload binary add-on ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: binary-addons-linux-x86_64-piers
          path: zips/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: false
          include-hidden-files: false
