name: Build Binary Add-ons — Linux Piers

on:
  workflow_dispatch:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: true
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: true
        type: string
        default: "Piers"
  workflow_call:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: false
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: false
        type: string
        default: "Piers"

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 — Kodi Piers
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Kodi
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.kodi_repo }}
          ref: ${{ inputs.kodi_ref }}
          path: xbmc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git ninja-build \
            autoconf automake autopoint libtool pkg-config \
            python3-dev curl unzip zip zlib1g-dev

      - name: Build and package binary add-ons
        shell: bash
        run: |
          set -euo pipefail

          rm -f xbmc/cmake/addons/.success xbmc/cmake/addons/.failure
          mkdir -p zips

          make -C xbmc/tools/depends/target/binary-addons \
            -j"$(nproc)" \
            PREFIX=/usr \
            ADDONS="inputstream.adaptive" \
            EXTRA_CMAKE_ARGS="-DPACKAGE_ZIP=ON -DPACKAGE_DIR=${GITHUB_WORKSPACE}/zips" \
            PACKAGE=1 V=1 VERBOSE=1
          - name: Build and package binary add-on
                  shell: bash
                  run: |
                    set -euo pipefail
          
                    rm -f xbmc/cmake/addons/.success xbmc/cmake/addons/.failure
                    mkdir -p zips
          
                    make -C xbmc/tools/depends/target/binary-addons \
                      -j"$(nproc)" \
                      PREFIX=/usr \
                      ADDONS="inputstream.adaptive" \
                      PACKAGE=1 \
                      EXTRA_CMAKE_ARGS="-DPACKAGE_ZIP=ON -DPACKAGE_DIR=${GITHUB_WORKSPACE}/zips" \
                      V=1 VERBOSE=1
          
                    if [ -s xbmc/cmake/addons/.failure ]; then
                      echo "::error::Some binary add-ons failed to build"
                      cat xbmc/cmake/addons/.failure
                      exit 1
                    fi
          
                    echo "=== Build status ==="
                    cat xbmc/cmake/addons/.success 2>/dev/null || true
          
                    echo "=== Searching for ZIP packages ==="
                    find "$GITHUB_WORKSPACE" \
                      -type f -name '*.zip' \
                      -not -path '*/.git/*' -print
          
                    find xbmc/cmake/addons -type f -name '*.zip' \
                      -exec cp -v {} zips/ \; 2>/dev/null || true
          
                    if ! find zips -maxdepth 1 -type f -name '*.zip' -print -quit | grep -q .; then
                      echo "::error::No ZIP packages found. Inspect the build output above."
                      exit 1
                    fi
          
                    echo "=== ZIPs ready for upload ==="
                    ls -lh zips/

      - name: Upload binary add-on ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: binary-addons-linux-x86_64-piers
          path: zips/*.zip
          if-no-files-found: error
          retention-days: 14
