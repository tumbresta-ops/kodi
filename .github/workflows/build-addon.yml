name: Build Binary Add-ons — Piers

on:
  workflow_dispatch:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: true
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: true
        type: string
        default: "Piers"
      addons:
        description: "Addon IDs/patterns, separated by spaces"
        required: true
        type: string
        default: "all"

  workflow_call:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: false
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: false
        type: string
        default: "Piers"
      addons:
        description: "Addon IDs/patterns, separated by spaces"
        required: false
        type: string
        default: "all"

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 — Kodi Piers
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout Kodi
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.kodi_repo }}
          ref: ${{ inputs.kodi_ref }}
          path: xbmc

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            ninja-build \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            python3-dev \
            curl \
            unzip \
            zip \
            zlib1g-dev

      - name: Build binary add-ons
        uses: ./.github/actions/build-binary-addons
        with:
          kodi-dir: xbmc
          addons: ${{ inputs.addons }}
          make-args: "PREFIX=${{ github.workspace }}/build-addons"

      - name: Package binary add-ons (.deb)
        run: |
          bash .github/scripts/package-binary-addons-deb.sh \
            xbmc \
            "${{ github.workspace }}/build-addons" \
            "${{ github.workspace }}/debs"

      - name: Upload binary add-on Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: binary-addons-deb-linux-x86_64-piers
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: false
          include-hidden-files: false
