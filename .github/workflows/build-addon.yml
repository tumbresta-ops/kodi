name: Build Binary Add-ons — Piers

on:
  workflow_dispatch:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: true
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: true
        type: string
        default: "Piers"
      addons:
        description: "Addon IDs/patterns, separated by spaces"
        required: true
        type: string
        default: "all"

  workflow_call:
    inputs:
      kodi_repo:
        description: "Upstream Kodi repository"
        required: false
        type: string
        default: "xbmc/xbmc"
      kodi_ref:
        description: "Upstream Kodi branch or ref"
        required: false
        type: string
        default: "Piers"
      addons:
        description: "Addon IDs/patterns, separated by spaces"
        required: false
        type: string
        default: "all"

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 — Kodi Piers
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Kodi
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.kodi_repo }}
          ref: ${{ inputs.kodi_ref }}
          path: xbmc

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            ninja-build \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            python3-dev \
            curl \
            unzip \
            zip \
            zlib1g-dev

      - name: Resolve, build and package add-ons
        shell: bash
        env:
          ADDON_PATTERNS: ${{ inputs.addons }}
        run: |
          set -euo pipefail

          ADDON_BUILD_DIR="xbmc/tools/depends/target/binary-addons"
          ADDON_STATUS_DIR="xbmc/cmake/addons"
          SUCCESS_FILE="${ADDON_STATUS_DIR}/.success"

          mkdir -p "${ADDON_STATUS_DIR}"
          rm -f \
            "${ADDON_STATUS_DIR}/.success" \
            "${ADDON_STATUS_DIR}/.failure"

          rm -rf "${GITHUB_WORKSPACE}/zips"
          mkdir -p "${GITHUB_WORKSPACE}/zips"

          if [[ -z "${ADDON_PATTERNS//[[:space:]]/}" ]]; then
            echo "::error::No add-on patterns specified"
            exit 1
          fi

          echo "=== Building add-ons ==="
          printf '%s\n' "${ADDON_PATTERNS}"

          make -C "${ADDON_BUILD_DIR}" \
            -j"$(nproc)" \
            PREFIX=/usr \
            ADDONS="${ADDON_PATTERNS}" \
            PACKAGE=1 \
            EXTRA_CMAKE_ARGS="-DPACKAGE_ZIP=ON -DPACKAGE_DIR=${GITHUB_WORKSPACE}/zips" \
            V=1 \
            VERBOSE=1

          if [[ -s "${ADDON_STATUS_DIR}/.failure" ]]; then
            echo "::error::Binary add-on build failed"
            cat "${ADDON_STATUS_DIR}/.failure"
            exit 1
          fi

          if [[ ! -s "${SUCCESS_FILE}" ]]; then
            echo "::error::No binary add-ons were built successfully"
            exit 1
          fi

          echo "=== Add-on build status ==="
          cat "${SUCCESS_FILE}"

          # Collect only Kodi addon Linux ZIPs; ignore ZIP test fixtures.
          declare -A copied=()
          total=0

          while IFS= read -r addon; do
            echo "=== Collecting: ${addon} ==="

            mapfile -t packages < <(
              find "${GITHUB_WORKSPACE}/xbmc" \
                -type f \
                -name "addon-${addon}-*-linux.zip" \
                -not -path '*/.git/*'
            )

            if [[ ${#packages[@]} -eq 0 ]]; then
              echo "::error::No Linux ZIP package found for '${addon}'"
              exit 1
            fi

            for package in "${packages[@]}"; do
              if [[ -z "${copied[$package]+x}" ]]; then
                cp -v "$package" "${GITHUB_WORKSPACE}/zips/"
                copied["$package"]=1
                ((total += 1))
              fi
            done
          done < "${SUCCESS_FILE}"

          if [[ "$total" -eq 0 ]]; then
            echo "::error::No add-on ZIP packages collected"
            exit 1
          fi

          echo "=== Final packages ==="
          find "${GITHUB_WORKSPACE}/zips" \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            -printf '%f\n'

      - name: Upload binary add-on ZIPs
        uses: actions/upload-artifact@v7
        with:
          name: binary-addons-linux-x86_64-piers
          path: zips/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: false
          include-hidden-files: false
